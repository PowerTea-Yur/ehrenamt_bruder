services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: volunteer-platform-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

volumes:
  sqlserver-data:
